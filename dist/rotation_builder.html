// Left Palette Rendering (Abilities, Buffs, Debuffs, Procs)
// ---------------------------------------------------------------------------
function getAbilityIconHtml(iconName, extraClass = "") {
  if (!iconName) {
    return "";
  }
  const clean = iconName.endsWith(".png") ? iconName : `${iconName}.png`;
  const lower = clean.toLowerCase();
  return `<img src="icons/${escapeAttr(clean)}" class="ability-icon ${extraClass}" onerror="if(this.src.indexOf('${escapeAttr(lower)}') === -1) { this.src='icons/${escapeAttr(lower)}'; } else { this.style.display='none'; }" alt="" loading="lazy" />`;
}

function switchPaletteTab(tab) {
  paletteTab = tab;
  for (const [id, key] of [
    ["tabAbilities", "abilities"],
    ["tabBuffs", "buffs"],
    ["tabDebuffs", "debuffs"],
    ["tabProcs", "procs"]
  ]) {
    document.getElementById(id).classList.toggle("active", key === tab);
  }
  renderPalette();
}

function preferredAbilityId(abilityObj) {
  const fmt = document.getElementById("idFormatSelect").value;
  return fmt === "fqn" ? abilityObj.fqn : abilityObj.slug;
}

function resolveAbilityDisplay(abilityId) {
  const norm = String(abilityId || "").toLowerCase().replace(/\s+/g, "_");
  const found = (currentLoadout.abilities || []).find(
    a => a.slug === norm || a.fqn === abilityId || a.name.toLowerCase() === String(abilityId || "").toLowerCase()
  );
  return found || null;
}

function renderPalette() {
  const container = document.getElementById("paletteContainer");
  const q = (document.getElementById("paletteSearch").value || "").trim().toLowerCase();
  container.innerHTML = "";

  if (paletteTab === "abilities") {
    const abilities = (currentLoadout.abilities || []).filter(
      a => !q || a.name.toLowerCase().includes(q) || a.slug.toLowerCase().includes(q) || a.fqn.toLowerCase().includes(q)
    );

    if (!abilities.length) {
      const msg = (currentLoadout && currentLoadout.class_name && currentLoadout.spec_name)
        ? "No matching castable abilities."
        : "Select a Class and Discipline above to load castable abilities.";
      container.innerHTML = `<div style="color:var(--text-muted);text-align:center;padding:20px;">${msg}</div>`;
      return;
    }

    for (const abl of abilities) {
      const card = document.createElement("div");
      card.className = "ability-item";
      card.draggable = true;
      card.title = "Drag into timeline or priority block, or click +Block / +Opt";
      card.addEventListener("dragstart", (e) => {
        const fmt = document.getElementById("idFormatSelect").value;
        const abId = fmt === "fqn" ? abl.fqn : abl.slug;
        currentDragData = {
          kind: "ability",
          slug: abl.slug,
          fqn: abl.fqn,
          ability_id: abId,
          triggers_gcd: !!abl.triggers_gcd
        };
        e.dataTransfer.setData("application/json", JSON.stringify(currentDragData));
        e.dataTransfer.effectAllowed = "copyMove";
        card.classList.add("is-dragging");
      });
      card.addEventListener("dragend", () => {
        card.classList.remove("is-dragging");
        currentDragData = null;
        clearDropHighlights();
      });

      const gcdBadge = abl.triggers_gcd
        ? '<span class="badge badge-gcd">GCD</span>'
        : '<span class="badge badge-offgcd">Off-GCD</span>';

      const metaParts = [];
      if (abl.cooldown > 0) metaParts.push(`CD: ${abl.cooldown}s`);
      if (abl.energy_cost > 0) metaParts.push(`Cost: ${abl.energy_cost}`);
      if (abl.activation_type !== "instant") metaParts.push(`${abl.activation_type} (${abl.activation_duration}s)`);
      if (abl.max_charges) metaParts.push(`${abl.max_charges} charges`);
      metaParts.push(`id: ${abl.slug}`);

      card.innerHTML = `
        <div class="palette-item-with-icon">
          <span class="drag-handle" title="Drag ability into timeline or block">⋮⋮</span>
          ${getAbilityIconHtml(abl.icon, "palette-icon")}
          <div class="ability-info">
            <div class="ability-title"><span class="ability-name-text">${escapeHtml(abl.name)}</span> ${gcdBadge}</div>
            <div class="ability-meta" title="${escapeHtml(abl.fqn)}">${escapeHtml(metaParts.join(" · "))}</div>
          </div>
        </div>
        <div class="palette-item-actions">
          <button class="btn-sm btn-purple" title="Add to active Priority Block" onclick="quickAddAbilityToBlock('${escapeAttr(abl.slug)}', '${escapeAttr(abl.fqn)}')">+Block</button>
          <button class="btn-sm btn-amber" title="Add as Optional Step" onclick="quickAddOptional('${escapeAttr(abl.slug)}', '${escapeAttr(abl.fqn)}')">+Opt</button>
        </div>
      `;
      container.appendChild(card);
    }
    return;
  }

  if (paletteTab === "buffs") {
    const buffs = (currentLoadout.caster_buffs || []).filter(
      b => !q || b.name.toLowerCase().includes(q) || b.source_name.toLowerCase().includes(q)
    );
    for (const b of buffs) {
      const card = document.createElement("div");
      card.className = "ability-item";
      const meta = [];
      if (b.duration > 0) meta.push(`${b.duration}s`);
      if (b.max_stacks > 1) meta.push(`Max Stacks: ${b.max_stacks}`);
      meta.push(`Source: ${b.source_name}`);
      card.innerHTML = `
        <div class="palette-item-with-icon">
          ${getAbilityIconHtml(b.icon, "palette-icon")}
          <div class="ability-info">
            <div class="ability-title">${escapeHtml(b.name)} ${b.is_proc ? '<span class="badge badge-offgcd">Proc</span>' : ''}</div>
            <div class="ability-meta">${escapeHtml(meta.join(" · "))}</div>
          </div>
        </div>
      `;
      container.appendChild(card);
    }
    return;
  }

  if (paletteTab === "debuffs") {
    const debuffs = (currentLoadout.target_debuffs || []).filter(
      d => !q || d.name.toLowerCase().includes(q) || d.source_name.toLowerCase().includes(q)
    );
    for (const d of debuffs) {
      const card = document.createElement("div");
      card.className = "ability-item";
      const meta = [];
      if (d.duration > 0) meta.push(`${d.duration}s`);
      if (d.max_stacks > 1) meta.push(`Max Stacks: ${d.max_stacks}`);
      meta.push(`Source: ${d.source_name}`);
      card.innerHTML = `
        <div class="palette-item-with-icon">
          ${getAbilityIconHtml(d.icon, "palette-icon")}
          <div class="ability-info">
            <div class="ability-title">${escapeHtml(d.name)} ${d.is_dot ? '<span class="badge badge-gcd">DoT</span>' : ''}</div>
            <div class="ability-meta">${escapeHtml(meta.join(" · "))}</div>
          </div>
        </div>
      `;
      container.appendChild(card);
    }
    return;
  }

  if (paletteTab === "procs") {
    const procs = (currentLoadout.procs || []).filter(
      p => !q || p.name.toLowerCase().includes(q) || p.source_name.toLowerCase().includes(q)
    );
    for (const p of procs) {
      const card = document.createElement("div");
      card.className = "ability-item";
      card.innerHTML = `
        <div class="palette-item-with-icon">
          ${getAbilityIconHtml(p.icon, "palette-icon")}
          <div class="ability-info">
            <div class="ability-title">${escapeHtml(p.name)} <span class="badge badge-offgcd">${p.icd}s ICD/Lockout</span></div>
            <div class="ability-meta">Source: ${escapeHtml(p.source_name)} (${escapeHtml(p.kind)})</div>
          </div>
        </div>
      `;
      container.appendChild(card);
    }
  }
}

// ---------------------------------------------------------------------------
// Center Timeline Rendering & Manipulation
// ---------------------------------------------------------------------------
function getDefaultAbilityId(preferOffGcd = false) {
  const list = currentLoadout.abilities || [];
  if (!list.length) return "saber_strike";
  if (preferOffGcd) {
    const off = list.find(a => !a.triggers_gcd);
    if (off) return preferredAbilityId(off);
  }
  const onGcd = list.find(a => a.triggers_gcd) || list[0];
  return preferredAbilityId(onGcd);
}

function quickAddAbilityToBlock(slug, fqn) {
  const fmt = document.getElementById("idFormatSelect").value;
  const abId = fmt === "fqn" ? fqn : slug;

  if (activeBlockIndex !== null && rotationSteps[activeBlockIndex] && rotationSteps[activeBlockIndex].type === "priority_block") {
    rotationSteps[activeBlockIndex].pool.push({ ability_id: abId, rules: {} });
    collapsedSteps.delete(activeBlockIndex);
  } else {
    // Create a new priority block and make it active
    rotationSteps.push({
      type: "priority_block",
      name: `Priority Window ${rotationSteps.length + 1}`,
      pool: [{ ability_id: abId, rules: {} }]
    });
    activeBlockIndex = rotationSteps.length - 1;
  }
  renderTimeline();
  renderRightPanel();
}

function quickAddOptional(slug, fqn) {
  const fmt = document.getElementById("idFormatSelect").value;
  const abId = fmt === "fqn" ? fqn : slug;
  rotationSteps.push({
    type: "optional",
    ability_id: abId,
    rules: {}
  });
  renderTimeline();
  renderRightPanel();
}

function addPriorityBlock() {
  const defaultFiller = (currentLoadout.abilities || []).find(a => a.slug.includes("saber_strike") || (a.cooldown === 0 && a.energy_cost === 0));
  const fillerId = defaultFiller ? preferredAbilityId(defaultFiller) : getDefaultAbilityId(false);
  rotationSteps.push({
    type: "priority_block",
    name: `Window ${rotationSteps.filter(s => s.type === "priority_block").length + 1}`,
    pool: [{ ability_id: fillerId, rules: {} }]
  });
  activeBlockIndex = rotationSteps.length - 1;
  renderTimeline();
  renderRightPanel();
}

function addOptionalStep() {
  rotationSteps.push({
    type: "optional",
    ability_id: getDefaultAbilityId(true),
    rules: {}
  });
  renderTimeline();
  renderRightPanel();
}

function addFixedStep() {
  rotationSteps.push({
    type: "fixed",
    ability_id: getDefaultAbilityId(false)
  });
  renderTimeline();
  renderRightPanel();
}

function addLoopAnchor() {
  const existingIdx = rotationSteps.findIndex(s => s.type === "loop_anchor");
  if (existingIdx !== -1) {
    showToast("An End Of Opener anchor already exists in the timeline. Move it using the Up/Down buttons or dragging.", true);
    return;
  }
  rotationSteps.push({ type: "loop_anchor" });
  renderTimeline();
  renderRightPanel();
}

function clearRotation() {
  if (!rotationSteps.length) return;
  rotationSteps = [];
  activeBlockIndex = null;
  collapsedSteps.clear();
  renderTimeline();
  renderRightPanel();
}

function expandCollapseAll(collapse) {
  collapsedSteps.clear();
  if (collapse) {
    rotationSteps.forEach((s, idx) => {
      if (s.type === "priority_block") collapsedSteps.add(idx);
    });
  }
  renderTimeline();
}

function toggleStepCollapse(idx) {
  if (collapsedSteps.has(idx)) {
    collapsedSteps.delete(idx);
  } else {
    collapsedSteps.add(idx);
  }
  renderTimeline();
}

function moveStep(idx, delta) {
  const target = idx + delta;
  if (target < 0 || target >= rotationSteps.length) return;
  const tmp = rotationSteps[idx];
  rotationSteps[idx] = rotationSteps[target];
  rotationSteps[target] = tmp;
  if (activeBlockIndex === idx) activeBlockIndex = target;
  else if (activeBlockIndex === target) activeBlockIndex = idx;
  renderTimeline();
  renderRightPanel();
}

function changeStepType(idx, newType) {
  const step = rotationSteps[idx];
  if (!step || step.type === newType) return;
  if (step.type === "loop_anchor" || newType === "loop_anchor") return;

  if (newType === "priority_block") {
    const ablId = step.ability_id || getDefaultAbilityId(false);
    const rules = step.rules ? JSON.parse(JSON.stringify(step.rules)) : {};
    const poolRow = { ability_id: ablId, rules: rules };
    if (step.lead_time !== undefined) poolRow.lead_time = step.lead_time;
    rotationSteps[idx] = {
      type: "priority_block",
      name: `Priority Window ${idx + 1}`,
      pool: [poolRow]
    };
    activeBlockIndex = idx;
    showToast(`Converted Step #${idx + 1} to Priority Block.`);
  } else if (newType === "fixed") {
    let ablId;
    if (step.type === "priority_block") {
      const first = (step.pool && step.pool.length > 0) ? step.pool[0] : null;
      ablId = first ? first.ability_id : getDefaultAbilityId(false);
    } else {
      ablId = step.ability_id || getDefaultAbilityId(false);
    }
    const newStep = {
      type: "fixed",
      ability_id: ablId
    };
    if (step.lead_time !== undefined) newStep.lead_time = step.lead_time;
    rotationSteps[idx] = newStep;
    if (activeBlockIndex === idx) activeBlockIndex = null;
    showToast(`Converted Step #${idx + 1} to Fixed Cast.`);
  } else if (newType === "optional") {
    let ablId;
    let rules = {};
    let leadTime = undefined;
    if (step.type === "priority_block") {
      const first = (step.pool && step.pool.length > 0) ? step.pool[0] : null;
      ablId = first ? first.ability_id : getDefaultAbilityId(true);
      rules = (first && first.rules) ? JSON.parse(JSON.stringify(first.rules)) : {};
      leadTime = first ? first.lead_time : undefined;
    } else {
      ablId = step.ability_id || getDefaultAbilityId(true);
      rules = step.rules ? JSON.parse(JSON.stringify(step.rules)) : {};
      leadTime = step.lead_time;
    }
    const newStep = {
      type: "optional",
      ability_id: ablId,
      rules: rules
    };
    if (leadTime !== undefined) newStep.lead_time = leadTime;
    rotationSteps[idx] = newStep;
    if (activeBlockIndex === idx) activeBlockIndex = null;
    showToast(`Converted Step #${idx + 1} to Optional Step.`);
  }
  renderTimeline();
  renderRightPanel();
}

function clearDropHighlights() {
  document.querySelectorAll(".drag-over-top, .drag-over-bottom, .drag-over-upgrade, .drag-over").forEach(el => {
    el.classList.remove("drag-over-top", "drag-over-bottom", "drag-over-upgrade", "drag-over");
  });
}

function onStepDragStart(e, idx) {
  e.stopPropagation();
  currentDragData = { kind: "step", stepIndex: idx };
  e.dataTransfer.setData("application/json", JSON.stringify(currentDragData));
  e.dataTransfer.effectAllowed = "move";
  const card = document.getElementById(`step-card-${idx}`);
  if (card) card.classList.add("is-dragging");
}

function onStepDragEnd(e) {
  document.querySelectorAll(".is-dragging").forEach(el => el.classList.remove("is-dragging"));
  currentDragData = null;
  clearDropHighlights();
}

function onStepCardDragOver(e, idx) {
  if (!currentDragData) return;
  e.preventDefault();
  e.stopPropagation();

  const card = document.getElementById(`step-card-${idx}`);
  if (!card) return;

  const rect = card.getBoundingClientRect();
  const relY = (e.clientY - rect.top) / rect.height;

  document.querySelectorAll(".step-card").forEach(c => {
    if (c !== card) c.classList.remove("drag-over-top", "drag-over-bottom", "drag-over-upgrade");
  });

  const step = rotationSteps[idx];

  if (currentDragData.kind === "step") {
    if (relY < 0.5) {
      card.classList.add("drag-over-top");
      card.classList.remove("drag-over-bottom", "drag-over-upgrade");
    } else {
      card.classList.add("drag-over-bottom");
      card.classList.remove("drag-over-top", "drag-over-upgrade");
    }
  } else if (currentDragData.kind === "ability") {
    if (step.type === "priority_block") {
      if (relY < 0.2) {
        card.classList.add("drag-over-top");
        card.classList.remove("drag-over-bottom", "drag-over-upgrade");
      } else if (relY > 0.8) {
        card.classList.add("drag-over-bottom");
        card.classList.remove("drag-over-top", "drag-over-upgrade");
      } else {
        card.classList.add("drag-over-upgrade");
        card.classList.remove("drag-over-top", "drag-over-bottom");
      }
    } else if (step.type === "fixed" || step.type === "optional") {
      if (relY < 0.25) {
        card.classList.add("drag-over-top");
        card.classList.remove("drag-over-bottom", "drag-over-upgrade");
      } else if (relY > 0.75) {
        card.classList.add("drag-over-bottom");
        card.classList.remove("drag-over-top", "drag-over-upgrade");
      } else {
        card.classList.add("drag-over-upgrade");
        card.classList.remove("drag-over-top", "drag-over-bottom");
      }
    } else if (step.type === "loop_anchor") {
      if (relY < 0.5) {
        card.classList.add("drag-over-top");
        card.classList.remove("drag-over-bottom", "drag-over-upgrade");
      } else {
        card.classList.add("drag-over-bottom");
        card.classList.remove("drag-over-top", "drag-over-upgrade");
      }
    }
  } else if (currentDragData.kind === "pool-row") {
    if (step.type === "priority_block") {
      card.classList.add("drag-over-upgrade");
    }
  }
}

function onStepCardDragLeave(e, idx) {
  const card = document.getElementById(`step-card-${idx}`);
  if (card && (!e.relatedTarget || !card.contains(e.relatedTarget))) {
    card.classList.remove("drag-over-top", "drag-over-bottom", "drag-over-upgrade");
  }
}

function onStepCardDrop(e, idx) {
  if (!currentDragData) return;
  e.preventDefault();
  e.stopPropagation();

  const card = document.getElementById(`step-card-${idx}`);
  const isTop = card && card.classList.contains("drag-over-top");
  const isUpgrade = card && card.classList.contains("drag-over-upgrade");
  clearDropHighlights();

  const data = currentDragData;
  currentDragData = null;

  if (data.kind === "step") {
    const fromIdx = data.stepIndex;
    if (fromIdx === idx) return;
    let targetIdx = isTop ? idx : idx + 1;
    if (fromIdx < targetIdx) targetIdx--;
    const [moved] = rotationSteps.splice(fromIdx, 1);
    rotationSteps.splice(targetIdx, 0, moved);
    if (activeBlockIndex === fromIdx) activeBlockIndex = targetIdx;
    else if (activeBlockIndex !== null) {
      if (fromIdx < activeBlockIndex && targetIdx >= activeBlockIndex) activeBlockIndex--;
      else if (fromIdx > activeBlockIndex && targetIdx <= activeBlockIndex) activeBlockIndex++;
    }
    renderTimeline();
    renderRightPanel();
    showToast(`Moved step to #${targetIdx + 1}`);
    return;
  }

  if (data.kind === "ability") {
    const fmt = document.getElementById("idFormatSelect").value;
    const abId = fmt === "fqn" ? data.fqn : data.slug;
    const step = rotationSteps[idx];

    if (isUpgrade && (step.type === "fixed" || step.type === "optional")) {
      const oldAbId = step.ability_id;
      const oldRules = step.rules ? JSON.parse(JSON.stringify(step.rules)) : {};
      const pool = [
        { ability_id: oldAbId, rules: oldRules },
        { ability_id: abId, rules: {} }
      ];
      rotationSteps[idx] = {
        type: "priority_block",
        name: `Priority Window ${idx + 1}`,
        pool: pool
      };
      activeBlockIndex = idx;
      renderTimeline();
      renderRightPanel();
      showToast(`Upgraded Step #${idx + 1} to Priority Block with ${data.slug}.`);
      return;
    }

    if (isUpgrade && step.type === "priority_block") {
      step.pool.push({ ability_id: abId, rules: {} });
      collapsedSteps.delete(idx);
      activeBlockIndex = idx;
      renderTimeline();
      renderRightPanel();
      showToast(`Added ${data.slug} to ${step.name || 'Priority Block'}.`);
      return;
    }

    let newStep;
    if (data.triggers_gcd) {
      newStep = {
        type: "priority_block",
        name: `Window ${rotationSteps.filter(s => s.type === "priority_block").length + 1}`,
        pool: [{ ability_id: abId, rules: {} }]
      };
    } else {
      newStep = {
        type: "optional",
        ability_id: abId,
        rules: {}
      };
    }

    const insertIdx = isTop ? idx : idx + 1;
    rotationSteps.splice(insertIdx, 0, newStep);
    if (newStep.type === "priority_block") {
      activeBlockIndex = insertIdx;
    }
    renderTimeline();
    renderRightPanel();
    showToast(`Inserted ${newStep.type === "optional" ? "Optional Step" : "Priority Block"} at #${insertIdx + 1}.`);
    return;
  }

  if (data.kind === "pool-row") {
    const step = rotationSteps[idx];
    if (step.type === "priority_block" && data.stepIndex !== idx) {
      const srcPool = rotationSteps[data.stepIndex].pool;
      const [movedRow] = srcPool.splice(data.rowIndex, 1);
      step.pool.push(movedRow);
      renderTimeline();
      renderRightPanel();
      showToast(`Moved ${movedRow.ability_id} to ${step.name || 'Priority Block'}.`);
    }
  }
}

function onPoolRowDragStart(e, stepIdx, rowIdx) {
  e.stopPropagation();
  currentDragData = { kind: "pool-row", stepIndex: stepIdx, rowIndex: rowIdx };
  e.dataTransfer.setData("application/json", JSON.stringify(currentDragData));
  e.dataTransfer.effectAllowed = "move";
  const rowEl = document.getElementById(`pool-row-${stepIdx}-${rowIdx}`);
  if (rowEl) rowEl.classList.add("is-dragging");
}

function onPoolRowDragEnd(e) {
  document.querySelectorAll(".is-dragging").forEach(el => el.classList.remove("is-dragging"));
  currentDragData = null;
  clearDropHighlights();
}

function onPoolRowDragOver(e, stepIdx, rowIdx) {
  if (!currentDragData) return;
  e.preventDefault();
  e.stopPropagation();

  const rowEl = document.getElementById(`pool-row-${stepIdx}-${rowIdx}`);
  if (!rowEl) return;

  const rect = rowEl.getBoundingClientRect();
  const relY = (e.clientY - rect.top) / rect.height;

  document.querySelectorAll(".pool-row").forEach(r => {
    if (r !== rowEl) r.classList.remove("drag-over-top", "drag-over-bottom");
  });

  if (relY < 0.5) {
    rowEl.classList.add("drag-over-top");
    rowEl.classList.remove("drag-over-bottom");
  } else {
    rowEl.classList.add("drag-over-bottom");
    rowEl.classList.remove("drag-over-top");
  }
}

function onPoolRowDragLeave(e, stepIdx, rowIdx) {
  const rowEl = document.getElementById(`pool-row-${stepIdx}-${rowIdx}`);
  if (rowEl && (!e.relatedTarget || !rowEl.contains(e.relatedTarget))) {
    rowEl.classList.remove("drag-over-top", "drag-over-bottom");
  }
}

function onPoolRowDrop(e, stepIdx, rowIdx) {
  if (!currentDragData) return;
  e.preventDefault();
  e.stopPropagation();

  const rowEl = document.getElementById(`pool-row-${stepIdx}-${rowIdx}`);
  const isTop = rowEl && rowEl.classList.contains("drag-over-top");
  clearDropHighlights();

  const data = currentDragData;
  currentDragData = null;

  if (data.kind === "pool-row") {
    const srcStepIdx = data.stepIndex;
    const srcRowIdx = data.rowIndex;
    const srcPool = rotationSteps[srcStepIdx].pool;
    const dstPool = rotationSteps[stepIdx].pool;

    if (srcStepIdx === stepIdx) {
      if (srcRowIdx === rowIdx) return;
      let targetRow = isTop ? rowIdx : rowIdx + 1;
      if (srcRowIdx < targetRow) targetRow--;
      const [moved] = srcPool.splice(srcRowIdx, 1);
      dstPool.splice(targetRow, 0, moved);
      renderTimeline();
      renderRightPanel();
      showToast(`Updated priority ranking in ${rotationSteps[stepIdx].name || 'Block'}.`);
    } else {
      let targetRow = isTop ? rowIdx : rowIdx + 1;
      const [moved] = srcPool.splice(srcRowIdx, 1);
      dstPool.splice(targetRow, 0, moved);
      renderTimeline();
      renderRightPanel();
      showToast(`Moved ${moved.ability_id} to ${rotationSteps[stepIdx].name || 'Block'}.`);
    }
    return;
  }

  if (data.kind === "ability") {
    const fmt = document.getElementById("idFormatSelect").value;
    const abId = fmt === "fqn" ? data.fqn : data.slug;
    const dstPool = rotationSteps[stepIdx].pool;
    let targetRow = isTop ? rowIdx : rowIdx + 1;
    dstPool.splice(targetRow, 0, { ability_id: abId, rules: {} });
    renderTimeline();
    renderRightPanel();
    showToast(`Inserted ${data.slug} at priority #${targetRow + 1}.`);
  }
}

function updateStepLeadTime(idx, val) {
  const num = parseFloat(val);
  if (isNaN(num) || num < 0) {
    delete rotationSteps[idx].lead_time;
  } else {
    rotationSteps[idx].lead_time = num;
  }
  renderTimeline();
  renderRightPanel();
}

function duplicateStep(idx) {
  const clone = JSON.parse(JSON.stringify(rotationSteps[idx]));
  if (clone.type === "priority_block") {
    clone.name = `${clone.name} (Copy)`;
  }
  rotationSteps.splice(idx + 1, 0, clone);
  if (clone.type === "priority_block") {
    activeBlockIndex = idx + 1;
  }
  renderTimeline();
  renderRightPanel();
  showToast("Duplicated step below.");
}

function deleteStep(idx) {
  rotationSteps.splice(idx, 1);
  if (activeBlockIndex === idx) activeBlockIndex = null;
  else if (activeBlockIndex !== null && activeBlockIndex > idx) activeBlockIndex--;
  renderTimeline();
  renderRightPanel();
}

function saveStepToTemplates(idx) {
  const step = rotationSteps[idx];
  const defaultName = step.type === "priority_block" ? step.name : `Opt: ${step.ability_id}`;
  const name = prompt("Enter a name for this reusable template:", defaultName);
  if (!name) return;
  savedTemplates.push({
    name: name.trim(),
    kind: "step",
    data: JSON.parse(JSON.stringify(step))
  });
  renderTimeline();
  renderRightPanel();
  showToast(`Saved template '${name.trim()}'`);
}

function saveBlockTailAsTemplate(idx) {
  const step = rotationSteps[idx];
  if (!step || step.type !== "priority_block" || !step.pool.length) return;
  const name = prompt("Save this block's priority rows as a reusable Filler Tail macro:", `${step.name} Tail`);
  if (!name) return;
  savedTemplates.push({
    name: name.trim(),
    kind: "tail",
    data: JSON.parse(JSON.stringify(step.pool))
  });
  renderTimeline();
  renderRightPanel();
  showToast(`Saved filler tail '${name.trim()}' (${step.pool.length} rows)`);
}

function injectTailIntoBlock(stepIdx, templateIdx) {
  const tmpl = savedTemplates[templateIdx];
  if (!tmpl) return;
  const rows = tmpl.kind === "tail" ? tmpl.data : (tmpl.data.pool || []);
  if (!rows.length) return;
  rotationSteps[stepIdx].pool.push(...JSON.parse(JSON.stringify(rows)));
  renderTimeline();
  renderRightPanel();
  showToast(`Appended ${rows.length} rows from '${tmpl.name}'`);
}

function movePoolRow(stepIdx, rowIdx, delta) {
  const pool = rotationSteps[stepIdx].pool;
  const target = rowIdx + delta;
  if (target < 0 || target >= pool.length) return;
  const tmp = pool[rowIdx];
  pool[rowIdx] = pool[target];
  pool[target] = tmp;
  renderTimeline();
  renderRightPanel();
}

function duplicatePoolRow(stepIdx, rowIdx) {
  const pool = rotationSteps[stepIdx].pool;
  pool.splice(rowIdx + 1, 0, JSON.parse(JSON.stringify(pool[rowIdx])));
  renderTimeline();
  renderRightPanel();
}

function deletePoolRow(stepIdx, rowIdx) {
  rotationSteps[stepIdx].pool.splice(rowIdx, 1);
  renderTimeline();
  renderRightPanel();
}

function addPoolRow(stepIdx) {
  rotationSteps[stepIdx].pool.push({
    ability_id: getDefaultAbilityId(false),
    rules: {}
  });
  activeBlockIndex = stepIdx;
  renderTimeline();
  renderRightPanel();
}

function onChangeIdFormat(fmt) {
  // Convert existing ability_ids in rotationSteps to the chosen format when matched
  for (const step of rotationSteps) {
    if (step.type === "fixed" || step.type === "optional") {
      const m = resolveAbilityDisplay(step.ability_id);
      if (m) step.ability_id = fmt === "fqn" ? m.fqn : m.slug;
    } else if (step.type === "priority_block") {
      for (const row of step.pool || []) {
        const m = resolveAbilityDisplay(row.ability_id);
        if (m) row.ability_id = fmt === "fqn" ? m.fqn : m.slug;
      }
    }
  }
  renderTimeline();
  renderRightPanel();
}

function buildAbilitySelectHtml(currentId, onChangeJs) {
  const fmt = document.getElementById("idFormatSelect").value;
  const abilities = currentLoadout.abilities || [];
  let matched = false;
  let opts = "";

  for (const a of abilities) {
    const val = fmt === "fqn" ? a.fqn : a.slug;
    const isSel = (a.slug === String(currentId).toLowerCase().replace(/\s+/g, "_")) || (a.fqn === currentId) || (val === currentId);
    if (isSel) matched = true;
    const gcdTag = a.triggers_gcd ? "" : " [Off-GCD]";
    opts += `<option value="${escapeAttr(isSel ? currentId : val)}" ${isSel ? "selected" : ""}>${escapeHtml(a.name)}${gcdTag} (${escapeHtml(a.slug)})</option>`;
  }

  if (!matched && currentId) {
    opts = `<option value="${escapeAttr(currentId)}" selected>${escapeHtml(currentId)} (Custom / Unmatched)</option>` + opts;
  }
  return `<select onchange="${onChangeJs}">${opts}</select>`;
}

function formatRulePillText(key, val) {
  switch (key) {
    case "target_hp_below_pct":
      if (val && typeof val === "object") {
        const pct = Math.round((val.pct ?? 0.3) * 100);
        return `<strong>Target HP &le; ${pct}%</strong> (or buff: ${escapeHtml(String(val.bypass_if_buff_active))})`;
      }
      return `<strong>Target HP &le; ${Math.round(Number(val) * 100)}%</strong> (${val})`;
    case "target_hp_above_pct":
      return `<strong>Target HP &gt; ${Math.round(Number(val) * 100)}%</strong> (${val})`;
    case "caster_has_buff":
      return `<strong>Caster Buff:</strong> ${escapeHtml(Array.isArray(val) ? val.join(" OR ") : String(val))}`;
    case "caster_does_not_have_buff":
      return `<strong>No Caster Buff:</strong> ${escapeHtml(Array.isArray(val) ? val.join(", ") : String(val))}`;
    case "target_has_debuff":
      return `<strong>Target Debuff:</strong> ${escapeHtml(Array.isArray(val) ? val.join(" OR ") : String(val))}`;
    case "target_doesnt_have_debuff":
      return `<strong>No Target Debuff:</strong> ${escapeHtml(Array.isArray(val) ? val.join(", ") : String(val))}`;
    case "caster_energy_below":
      return `<strong>Energy/Force &lt;</strong> ${escapeHtml(String(val))}`;
    case "caster_energy_above":
      return `<strong>Energy/Force &ge;</strong> ${escapeHtml(String(val))}`;
    case "proc_cooldown_above":
      if (val && typeof val === "object") {
        return `<strong>Proc ICD &gt; ${escapeHtml(String(val.value))}s:</strong> ${escapeHtml(String(val.name))}`;
      }
      return `<strong>${escapeHtml(key)}:</strong> ${escapeHtml(JSON.stringify(val))}`;
    case "ability_cooldown_under":
      if (val && typeof val === "object") {
        return `<strong>Ability CD &lt; ${escapeHtml(String(val.value))}s:</strong> ${escapeHtml(String(val.name))}`;
      }
      return `<strong>${escapeHtml(key)}:</strong> ${escapeHtml(JSON.stringify(val))}`;
    case "ability_cooldown_above":
      if (val && typeof val === "object") {
        return `<strong>Ability CD &gt; ${escapeHtml(String(val.value))}s:</strong> ${escapeHtml(String(val.name))}`;
      }
      return `<strong>${escapeHtml(key)}:</strong> ${escapeHtml(JSON.stringify(val))}`;
    case "caster_buff_stacks":
    case "caster_has_buff_stacks":
    case "caster_buff_charges":
    case "target_debuff_stacks":
    case "target_has_debuff_stacks": {
      const isTarget = key.startsWith("target");
      const actorLbl = isTarget ? "Target Debuff Stacks" : "Caster Buff Stacks";
      if (Array.isArray(val)) {
        const op = val[2] || ">=";
        return `<strong>${actorLbl}:</strong> ${escapeHtml(String(val[0]))} ${escapeHtml(op)} ${escapeHtml(String(val[1]))}`;
      }
      if (val && typeof val === "object") {
        const bName = val.name || val.buff || val.debuff || val.ability_spec || "?";
        const st = val.stacks ?? val.count ?? val.value ?? 1;
        const op = val.comparison || val.operator || ">=";
        return `<strong>${actorLbl}:</strong> ${escapeHtml(String(bName))} ${escapeHtml(String(op))} ${escapeHtml(String(st))}`;
      }
      return `<strong>${escapeHtml(key)}:</strong> ${escapeHtml(JSON.stringify(val))}`;
    }
    default:
      return `<strong>${escapeHtml(key)}:</strong> ${escapeHtml(JSON.stringify(val))}`;
  }
}

function renderRulesHtml(rulesObj, stepIdx, poolIdx = null) {
  const entries = Object.entries(rulesObj || {});
  let html = '<div class="rules-container">';
  if (!entries.length) {
    html += '<span class="rule-unconditional">Always (No conditions)</span>';
  } else {
    for (const [k, v] of entries) {
      const poolArg = poolIdx === null ? "null" : poolIdx;
      html += `
        <span class="rule-pill" onclick="openRuleModal(${stepIdx}, ${poolArg}, '${escapeAttr(k)}')" style="cursor:pointer;" title="Click to edit condition">
          ${formatRulePillText(k, v)}
          <span class="rule-del" onclick="event.stopPropagation(); deleteRule(${stepIdx}, ${poolArg}, '${escapeAttr(k)}')">&times;</span>
        </span>
      `;
    }
  }
  const poolArg = poolIdx === null ? "null" : poolIdx;
  html += `<button class="btn-sm" onclick="openRuleModal(${stepIdx}, ${poolArg}, null)">+ Rule</button>`;
  html += "</div>";
  return html;
}

function deleteRule(stepIdx, poolIdx, ruleKey) {
  if (poolIdx === null) {
    delete rotationSteps[stepIdx].rules[ruleKey];
  } else {
    delete rotationSteps[stepIdx].pool[poolIdx].rules[ruleKey];
  }
  renderTimeline();
  renderRightPanel();
}

function detectExecuteAbilitySlug() {
  const abilities = (currentLoadout && currentLoadout.abilities) || [];
  const executeKeywords = [
    "assassinate", "vicious_throw", "takedown", "quickdraw",
    "dispatch", "shadow_strike", "spinning_strike", "rail_shot",
    "high_impact_bolt", "missile_blast", "volt_rush", "telekinetic_blitz"
  ];
  for (const kw of executeKeywords) {
    const found = abilities.find(a =>
      (a.slug && a.slug.toLowerCase().includes(kw)) ||
      (a.name && a.name.toLowerCase().includes(kw.replace(/_/g, " ")))
    );
    if (found) return found.slug;
  }
  return abilities.length > 0 ? abilities[0].slug : "";
}

function populateSub30DefaultAbilitySelect() {
  const sel = document.getElementById("sub30DefaultAbilitySelect");
  if (!sel) return;
  const prevVal = SUB30_DEFAULT_ABILITY || sel.value;
  sel.innerHTML = "";
  const abilities = (currentLoadout && currentLoadout.abilities) || [];
  const detected = detectExecuteAbilitySlug();
  abilities.forEach(a => {
    const opt = document.createElement("option");
    opt.value = a.slug;
    const isDetected = (a.slug === detected);
    opt.textContent = (isDetected ? "[Execute] " : "") + a.name + (a.triggers_gcd ? "" : " [Off-GCD]");
    sel.appendChild(opt);
  });
  if (prevVal && Array.from(sel.options).some(o => o.value === prevVal)) {
    sel.value = prevVal;
  } else if (detected) {
    sel.value = detected;
  }
  SUB30_DEFAULT_ABILITY = sel.value;
}

function setTimelineViewMode(mode) {
  TIMELINE_VIEW_MODE = mode;
  document.getElementById("tabModeRotation")?.classList.toggle("active", mode === "rotation");
  document.getElementById("tabModeSub30")?.classList.toggle("active", mode === "sub30");
  const settingsEl = document.getElementById("sub30HelperSettings");
  if (settingsEl) {
    settingsEl.style.display = mode === "sub30" ? "inline-flex" : "none";
  }
  if (mode === "sub30") {
    populateSub30DefaultAbilitySelect();
  }
  renderTimeline();
}

function hasSub30Rule(rules) {
  return rules && (rules.target_hp_below_pct !== undefined);
}

function getStepSub30Status(step) {
  if (step.type === "priority_block") {
    const pool = step.pool || [];
    const idx = pool.findIndex(r => hasSub30Rule(r.rules));
    if (idx !== -1) {
      return { hasSub30: true, candidateIndex: idx, candidate: pool[idx], threshold: pool[idx].rules.target_hp_below_pct };
    }
    return { hasSub30: false };
  } else if (step.type === "optional") {
    if (hasSub30Rule(step.rules)) {
      return { hasSub30: true, threshold: step.rules.target_hp_below_pct };
    }
    return { hasSub30: false };
  }
  return { hasSub30: false };
}

function transformFixedToSub30Priority(stepIdx) {
  const step = rotationSteps[stepIdx];
  if (!step || step.type !== "fixed") return;
  const executeAbl = SUB30_DEFAULT_ABILITY || detectExecuteAbilitySlug() || step.ability_id;
  const origAbl = step.ability_id;
  const execDisp = resolveAbilityDisplay(executeAbl);
  const isOffGcd = execDisp && !execDisp.triggers_gcd;
  const origDisp = resolveAbilityDisplay(origAbl);

  rotationSteps[stepIdx] = {
    type: "priority_block",
    name: `Sub 30: ${execDisp?.name || executeAbl} / ${origDisp?.name || origAbl}`,
    pool: [
      {
        ability_id: executeAbl,
        rules: { target_hp_below_pct: SUB30_THRESHOLD },
        lead_time: isOffGcd ? (step.lead_time || 0.4) : null
      },
      {
        ability_id: origAbl,
        rules: {},
        lead_time: step.lead_time
      }
    ],
    _wasFixed: origAbl
  };
  renderTimeline();
  renderRightPanel();
}

function revertSub30ToFixed(stepIdx) {
  const step = rotationSteps[stepIdx];
  if (!step || step.type !== "priority_block") return;
  const fallbackAbl = step._wasFixed || (step.pool && step.pool.length > 1 ? step.pool[1].ability_id : (step.pool && step.pool[0] ? step.pool[0].ability_id : ""));
  rotationSteps[stepIdx] = {
    type: "fixed",
    ability_id: fallbackAbl,
    lead_time: (step.pool && step.pool[1]) ? step.pool[1].lead_time : null
  };
  renderTimeline();
  renderRightPanel();
}

function addSub30ToPriorityBlock(stepIdx) {
  const step = rotationSteps[stepIdx];
  if (!step || step.type !== "priority_block") return;
  const executeAbl = SUB30_DEFAULT_ABILITY || detectExecuteAbilitySlug();
  if (!executeAbl) return;
  const execDisp = resolveAbilityDisplay(executeAbl);
  const isOffGcd = execDisp && !execDisp.triggers_gcd;

  if (!step.pool) step.pool = [];
  step.pool.unshift({
    ability_id: executeAbl,
    rules: { target_hp_below_pct: SUB30_THRESHOLD },
    lead_time: isOffGcd ? 0.4 : null
  });
  renderTimeline();
  renderRightPanel();
}

function removeSub30FromPriorityBlock(stepIdx, candIdx) {
  const step = rotationSteps[stepIdx];
  if (!step || step.type !== "priority_block" || !step.pool) return;
  step.pool.splice(candIdx, 1);
  renderTimeline();
  renderRightPanel();
}

function toggleSub30Optional(stepIdx) {
  const step = rotationSteps[stepIdx];
  if (!step || step.type !== "optional") return;
  if (!step.rules) step.rules = {};
  if (step.rules.target_hp_below_pct !== undefined) {
    delete step.rules.target_hp_below_pct;
  } else {
    step.rules.target_hp_below_pct = SUB30_THRESHOLD;
  }
  renderTimeline();
  renderRightPanel();
}

function insertSub30OptionalAt(index) {
  const executeAbl = SUB30_DEFAULT_ABILITY || detectExecuteAbilitySlug();
  const execDisp = resolveAbilityDisplay(executeAbl);
  const isOffGcd = execDisp && !execDisp.triggers_gcd;

  const newStep = {
    type: "optional",
    ability_id: executeAbl,
    rules: { target_hp_below_pct: SUB30_THRESHOLD },
    lead_time: isOffGcd ? 0.4 : 0.0
  };
  rotationSteps.splice(index, 0, newStep);
  renderTimeline();
  renderRightPanel();
}

function renderTimeline() {
  const container = document.getElementById("timelineContainer");
  container.innerHTML = "";

  if (!rotationSteps.length) {
    container.innerHTML = `
      <div class="timeline-drop-target timeline-empty-drop" id="emptyTimelineDrop" style="padding:48px 20px;">
        <div style="font-size:15px;font-weight:600;color:var(--text-main);margin-bottom:8px;">Rotation Timeline is Empty</div>
        <div style="margin-bottom:14px;">Drag an ability from the left palette, click <strong>+ Priority Block</strong>, or select an existing rotation from the top bar.</div>
        <button class="btn-purple" onclick="addPriorityBlock()">+ Create First Priority Block</button>
      </div>
    `;
    const emptyDrop = document.getElementById("emptyTimelineDrop");
    if (emptyDrop) {
      emptyDrop.addEventListener("dragover", (e) => {
        if (!currentDragData) return;
        e.preventDefault();
        e.stopPropagation();
        emptyDrop.classList.add("drag-over");
      });
      emptyDrop.addEventListener("dragleave", () => emptyDrop.classList.remove("drag-over"));
      emptyDrop.addEventListener("drop", (e) => {
        if (!currentDragData) return;
        e.preventDefault();
        e.stopPropagation();
        emptyDrop.classList.remove("drag-over");
        const data = currentDragData;
        currentDragData = null;
        if (data.kind === "ability") {
          const fmt = document.getElementById("idFormatSelect").value;
          const abId = fmt === "fqn" ? data.fqn : data.slug;
          if (data.triggers_gcd) {
            rotationSteps.push({
              type: "priority_block",
              name: "Window 1",
              pool: [{ ability_id: abId, rules: {} }]
            });
            activeBlockIndex = 0;
          } else {
            rotationSteps.push({
              type: "optional",
              ability_id: abId,
              rules: {}
            });
          }
          renderTimeline();
          renderRightPanel();
          showToast(`Added ${abId} to rotation.`);
        }
      });
    }
    return;
  }

  const isSub30Mode = (TIMELINE_VIEW_MODE === "sub30");

  if (isSub30Mode) {
    const banner = document.createElement("div");
    banner.className = "sub30-banner";
    banner.innerHTML = `
      <div>
        <strong style="color:var(--accent);">Sub 30 helper Active</strong>
        <span style="margin-left:8px;font-size:11.5px;color:var(--text-muted);">

        </span>
      </div>
      <button class="btn-sm" onclick="setTimelineViewMode('rotation')">Back to Rotation View</button>
    `;
    container.appendChild(banner);
  }

  const anchorIdx = rotationSteps.findIndex(s => s.type === "loop_anchor");
  let execStepCounter = 0;

  rotationSteps.forEach((step, idx) => {
    // If in Sub 30 helper mode, render a gap insert button between steps
    if (isSub30Mode && idx > 0) {
      const gapBtn = document.createElement("button");
      gapBtn.type = "button";
      gapBtn.className = "sub30-insert-btn";
      gapBtn.textContent = `+ Insert Sub 30 Optional Weave at #${execStepCounter}`;
      gapBtn.onclick = () => insertSub30OptionalAt(idx);
      container.appendChild(gapBtn);
    }

    const isOpener = anchorIdx !== -1 && idx < anchorIdx;
    const phaseBadge = isOpener
      ? '<span class="badge badge-opener">OPENER</span>'
      : '<span class="badge badge-loop">LOOP</span>';

    const sub30Info = getStepSub30Status(step);
    const sub30Badge = sub30Info.hasSub30
      ? `<span class="badge badge-sub30" title="Includes sub-30 execute phase logic">Sub 30</span>`
      : "";

    if (step.type === "loop_anchor") {
      const anchorCard = document.createElement("div");
      anchorCard.className = "step-card step-anchor";
      anchorCard.id = `step-card-${idx}`;
      anchorCard.ondragover = (e) => onStepCardDragOver(e, idx);
      anchorCard.ondragleave = (e) => onStepCardDragLeave(e, idx);
      anchorCard.ondrop = (e) => onStepCardDrop(e, idx);
      anchorCard.innerHTML = `

        </label>
      ` : "";

      const sub30HelperRowHtml = isSub30Mode ? `

          <div style="font-size:11.5px;color:var(--text-muted);">

          </div>
          <button class="btn-amber btn-sm" onclick="transformFixedToSub30Priority(${idx})" title="Convert to priority block with execute priority #1 and fallback to this ability">Replace for Sub 30</button>
        </div>
      ` : "";

      card.innerHTML = `
        <div class="step-header">
          <div class="step-header-left">
            <span class="drag-handle" draggable="true" title="Drag to reorder step"
                  ondragstart="onStepDragStart(event, ${idx})"
                  ondragend="onStepDragEnd(event)">⋮⋮</span>
            <span class="step-num">#${execStepCounter}</span>

            <button class="btn-sm btn-danger" onclick="deleteStep(${idx})" title="Delete Step">&times;</button>
          </div>
        </div>
        ${sub30HelperRowHtml}
      `;
      container.appendChild(card);
      return;
    }

    if (step.type === "optional") {
      card.className = "step-card step-optional" + (isSub30Mode ? " sub30-step-highlight" : "");
      const m = resolveAbilityDisplay(step.ability_id);
      const isOffGcd = m && !m.triggers_gcd;
      const iconHtml = getAbilityIconHtml(m?.icon, "step-icon");
      const selectHtml = buildAbilitySelectHtml(
        step.ability_id,
        `rotationSteps[${idx}].ability_id = this.value; renderTimeline(); renderRightPanel();`
      );
      const offGcdControlsHtml = isOffGcd ? `
        <span class="badge badge-offgcd" title="Off-GCD: Casts early before next GCD">Off-GCD (Early Weave)</span>

          Lead:
          <input type="number" step="0.05" min="0" max="1.5" style="width:52px;padding:2px 4px;font-size:11px;border-radius:4px;border:1px solid var(--border-color);background:var(--bg-input);color:var(--text-main);" value="${step.lead_time !== undefined ? step.lead_time : 0.4}" onchange="updateStepLeadTime(${idx}, this.value)">s
        </label>
      ` : `
        <label style="font-size:11px;margin-left:6px;display:inline-flex;align-items:center;gap:3px;color:var(--text-muted);" title="Seconds to pre-cast before next GCD finishes">
          Lead:
          <input type="number" step="0.05" min="0" max="1.5" style="width:52px;padding:2px 4px;font-size:11px;border-radius:4px;border:1px solid var(--border-color);background:var(--bg-input);color:var(--text-main);" value="${step.lead_time !== undefined ? step.lead_time : 0}" onchange="updateStepLeadTime(${idx}, this.value)">s
        </label>
      `;

      const sub30HelperRowHtml = isSub30Mode ? `
        <div style="margin-top:6px;padding:6px 10px;background:rgba(255,170,0,0.06);border:1px dashed rgba(255,170,0,0.35);border-radius:6px;display:flex;align-items:center;justify-content:space-between;gap:8px;">
          <div style="font-size:11.5px;">
            ${sub30Info.hasSub30
              ? `<span style="font-weight:600;color:var(--accent);">Active Sub 30 Cast (Target HP &le; ${Math.round((sub30Info.threshold || 0.3) * 100)}%)</span>`
              : `<span style="color:var(--text-muted);">Active in all phases (no HP rule).</span>`}

      card.innerHTML = `

        <div class="step-body">
          ${renderRulesHtml(step.rules || {}, idx, null)}
          ${sub30HelperRowHtml}
        </div>
      `;
      container.appendChild(card);
      return;
    }

    if (step.type === "priority_block") {
      const isCollapsed = collapsedSteps.has(idx);

      card.className = "step-card step-priority" + (isActive ? " active-block" : "") + (isSub30Mode && sub30Info.hasSub30 ? " sub30-active-card" : "");
      card.onclick = () => {
        if (activeBlockIndex !== idx) {

      const pool = step.pool || [];

              <span style="font-size:11.5px;color:var(--text-muted);">No execute priority set for this block.</span>

              <input type="number" step="0.05" min="0" max="1.5" style="width:48px;padding:1px 4px;font-size:11px;" value="${rowLeadVal}" onclick="event.stopPropagation()" onchange="rotationSteps[${idx}].pool[${rIdx}].lead_time = parseFloat(this.value); renderTimeline(); renderRightPanel();" />s
            </label>` : "";

          const sub30RowClass = isRowSub30 ? " sub30-row-highlight" : "";
          const sub30Pill = isRowSub30 ? `

              <div style="display:flex;gap:3px;flex-shrink:0;">
                <button class="btn-sm" onclick="event.stopPropagation(); movePoolRow(${idx}, ${rIdx}, -1)" title="Move Priority Up">&uarr;</button>
                <button class="btn-sm" onclick="event.stopPropagation(); movePoolRow(${idx}, ${rIdx}, 1)" title="Move Priority Down">&darr;</button>
                <button class="btn-sm" onclick="event.stopPropagation(); duplicatePoolRow(${idx}, ${rIdx})" title="Duplicate Row">Clone</button>
                <button class="btn-sm btn-danger" onclick="event.stopPropagation(); deletePoolRow(${idx}, ${rIdx})" title="Remove Row">&times;</button>
              </div>
            </div>
          `;
        });

        let tailInjectHtml = "";
        if (savedTemplates.length > 0) {
          const opts = savedTemplates.map((t, tIdx) => `<option value="${tIdx}">${escapeHtml(t.name)}</option>`).join("");
          tailInjectHtml = `
            <select onchange="if(this.value!==''){injectTailIntoBlock(${idx}, Number(this.value)); this.value='';}" style="font-size:11px;padding:3px 6px;">
              <option value="">+ Append Saved Template/Tail...</option>
              ${opts}
            </select>
          `;
        }

        const revertFixedBtn = (isSub30Mode && (step._wasFixed || (pool.length === 2 && isSub30Mode))) ? `
          <button class="btn-sm" onclick="event.stopPropagation(); revertSub30ToFixed(${idx})" title="Revert block back to a simple fixed step">Revert to Fixed</button>
        ` : "";

        rowsHtml += `
          <div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px;">
            <div style="display:flex;gap:6px;align-items:center;">
              <button class="btn-sm btn-purple" onclick="event.stopPropagation(); addPoolRow(${idx})">+ Add Ability to Pool</button>
              ${isSub30Mode && !sub30Info.hasSub30 ? `<button class="btn-sm btn-amber" onclick="event.stopPropagation(); addSub30ToPriorityBlock(${idx})">Add Sub 30 Prio #1</button>` : ""}
              ${tailInjectHtml}
            </div>
            <div style="display:flex;gap:6px;align-items:center;">
              ${revertFixedBtn}
              <button class="btn-sm" onclick="event.stopPropagation(); saveBlockTailAsTemplate(${idx})" title="Save these priority rows as a reusable filler tail">Save Pool as Filler Tail</button>
            </div>
          </div>
        `;
      } else {
        const summary = pool.map(r => r.ability_id).join(" → ");
        rowsHtml = `<div style="font-size:11.5px;color:var(--text-muted);">${pool.length} abilities: ${escapeHtml(summary)}</div>`;
      }

      card.innerHTML = `
        <div class="step-header">
          <div class="step-header-left">
            <span class="drag-handle" draggable="true" title="Drag to reorder step"
                  ondragstart="onStepDragStart(event, ${idx})"
                  ondragend="onStepDragEnd(event)">⋮⋮</span>
            <button class="btn-sm" onclick="event.stopPropagation(); toggleStepCollapse(${idx})">${isCollapsed ? "▸" : "▾"}</button>
            <span class="step-num">#${execStepCounter}</span>
            ${phaseBadge}
            <select class="step-type-select type-priority" onchange="changeStepType(${idx}, this.value)" onclick="event.stopPropagation();" title="Change block type">
              <option value="fixed">Fixed Cast</option>
              <option value="optional">Optional (Non-Blocking)</option>
              <option value="priority_block" selected>Priority Block (${pool.length})</option>
            </select>
            ${sub30Badge}
            <input type="text" value="${escapeAttr(step.name || "")}" onchange="rotationSteps[${idx}].name = this.value; renderRightPanel();" onclick="event.stopPropagation();" style="flex:1;min-width:160px;font-weight:600;">
          </div>
          <div style="display:flex;gap:4px;">
            <button class="btn-sm" onclick="event.stopPropagation(); saveStepToTemplates(${idx})" title="Save Block to Clipboard">Save Template</button>
            <button class="btn-sm" onclick="event.stopPropagation(); moveStep(${idx}, -1)" title="Move Block Up">&uarr;</button>
            <button class="btn-sm" onclick="event.stopPropagation(); moveStep(${idx}, 1)" title="Move Block Down">&darr;</button>
            <button class="btn-sm" onclick="event.stopPropagation(); duplicateStep(${idx})" title="Clone entire Priority Block below">Clone Block</button>
            <button class="btn-sm btn-danger" onclick="event.stopPropagation(); deleteStep(${idx})" title="Delete Block">&times;</button>
          </div>
        </div>
        <div class="step-body">
          ${rowsHtml}
        </div>
      `;
      container.appendChild(card);
    }
  });

  // Append drop zone at the bottom of the timeline
  const bottomDrop = document.createElement("div");
  bottomDrop.className = "timeline-drop-target";
  bottomDrop.id = "timelineBottomDrop";
  bottomDrop.innerHTML = `<span>＋ Drop ability here to append to the end of the rotation</span>`;

  bottomDrop.addEventListener("dragover", (e) => {
    if (!currentDragData) return;
    e.preventDefault();
    e.stopPropagation();
    bottomDrop.classList.add("drag-over");
  });
  bottomDrop.addEventListener("dragleave", () => {
    bottomDrop.classList.remove("drag-over");
  });
  bottomDrop.addEventListener("drop", (e) => {
    if (!currentDragData) return;
    e.preventDefault();
    e.stopPropagation();
    bottomDrop.classList.remove("drag-over");
    const data = currentDragData;
    currentDragData = null;

    if (data.kind === "ability") {
      const fmt = document.getElementById("idFormatSelect").value;
      const abId = fmt === "fqn" ? data.fqn : data.slug;
      if (data.triggers_gcd) {
        rotationSteps.push({
          type: "priority_block",
          name: `Window ${rotationSteps.filter(s => s.type === "priority_block").length + 1}`,
          pool: [{ ability_id: abId, rules: {} }]
        });
        activeBlockIndex = rotationSteps.length - 1;
      } else {
        rotationSteps.push({
          type: "optional",
          ability_id: abId,
          rules: {}
        });
      }
      renderTimeline();
      renderRightPanel();
      showToast(`Appended ${abId} to rotation.`);
    } else if (data.kind === "step") {
      const fromIdx = data.stepIndex;
      if (fromIdx !== rotationSteps.length - 1) {
        const [moved] = rotationSteps.splice(fromIdx, 1);
        rotationSteps.push(moved);
        renderTimeline();
        renderRightPanel();
        showToast("Moved step to end of rotation.");
      }
    }
  });
  container.appendChild(bottomDrop);
}

function openRuleModal(stepIdx, poolIdx = null, editKey = null) {
  ruleModalContext = { stepIndex: stepIdx, poolIndex: poolIdx, editKey: editKey };
  const conditions = (workspaceCatalog && workspaceCatalog.conditions) || [];
  const sel = document.getElementById("ruleKeySelect");
  sel.innerHTML = "";

  for (const c of conditions) {
    const opt = document.createElement("option");
    opt.value = c.key;
    opt.textContent = `${c.category}: ${c.label} (${c.key})`;
    sel.appendChild(opt);
  }

  const targetRules = poolIdx === null
    ? (rotationSteps[stepIdx].rules || {})
    : (rotationSteps[stepIdx].pool[poolIdx].rules || {});

  let initialVal = null;
  if (editKey && editKey in targetRules) {
    // Normalize aliases to canonical keys if needed
    sel.value = conditions.some(c => c.key === editKey) ? editKey : "caster_buff_stacks";
    initialVal = targetRules[editKey];
  } else {
    sel.value = "caster_has_buff";
  }

  renderRuleValueForm(initialVal);
  document.getElementById("ruleModalBackdrop").classList.add("open");
}

function closeRuleModal() {
  document.getElementById("ruleModalBackdrop").classList.remove("open");
  ruleModalContext = null;
}

function buildDatalistOrSelect(id, items, currentVal, placeholder) {
  const listId = `${id}_datalist`;
  const opts = items.map(it => `<option value="${escapeAttr(it.name)}">${escapeHtml(it.label || it.name)}</option>`).join("");
  return `
    <div style="display:flex;gap:6px;">
      <select onchange="document.getElementById('${id}').value = this.value" style="flex:1;">
        <option value="">-- Pick Discovered ${escapeHtml(placeholder)} --</option>
        ${opts}
      </select>
      <input type="text" id="${id}" list="${listId}" value="${escapeAttr(currentVal || "")}" placeholder="Or type exact name..." style="flex:1;">
    </div>
  `;
}

function renderRuleValueForm(existingVal = null) {
  const key = document.getElementById("ruleKeySelect").value;
  const conditions = (workspaceCatalog && workspaceCatalog.conditions) || [];
  const meta = conditions.find(c => c.key === key) || {};
  document.getElementById("ruleTypeDesc").textContent = meta.description || "";

  const container = document.getElementById("ruleDynamicFields");
  const buffItems = (currentLoadout.caster_buffs || []).map(b => ({
    name: b.name,
    label: `${b.name} (${b.source_name}${b.max_stacks > 1 ? `, max ${b.max_stacks} stacks` : ""})`
  }));
  const debuffItems = (currentLoadout.target_debuffs || []).map(d => ({
    name: d.name,
    label: `${d.name} (${d.source_name}${d.is_dot ? ", DoT" : ""})`
  }));
  const procItems = (currentLoadout.procs || []).map(p => ({
    name: p.name,
    label: `${p.name} (${p.icd}s ICD)`
  }));
  const abilityItems = (currentLoadout.abilities || []).map(a => ({
    name: a.name,
    label: `${a.name} (CD: ${a.cooldown}s)`
  }));

  if (key === "caster_has_buff" || key === "caster_does_not_have_buff") {
    const cur = typeof existingVal === "string" ? existingVal : (buffItems[0]?.name || "");
    container.innerHTML = `
      <div class="form-group">
        <label>Caster Buff Name</label>
        ${buildDatalistOrSelect("ruleBuffInput", buffItems, cur, "Caster Buff")}
      </div>
    `;
    return;
  }

  if (key === "target_has_debuff" || key === "target_doesnt_have_debuff") {
    const cur = typeof existingVal === "string" ? existingVal : (debuffItems[0]?.name || "");
    container.innerHTML = `
      <div class="form-group">
        <label>Target Debuff / DoT Name</label>
        ${buildDatalistOrSelect("ruleDebuffInput", debuffItems, cur, "Target Debuff")}
      </div>
    `;
    return;
  }

  if (key === "caster_buff_stacks" || key === "target_debuff_stacks") {
    const isTarget = key === "target_debuff_stacks";
    const items = isTarget ? debuffItems : buffItems;
    let curName = items[0]?.name || "";
    let curStacks = 3;
    let curOp = "gte";
    if (Array.isArray(existingVal)) {
      curName = existingVal[0] || curName;
      curStacks = existingVal[1] ?? 3;
      curOp = existingVal[2] || "gte";
    } else if (existingVal && typeof existingVal === "object") {
      curName = existingVal.name || existingVal.buff || existingVal.debuff || curName;
      curStacks = existingVal.stacks ?? existingVal.count ?? existingVal.value ?? 3;
      curOp = existingVal.comparison || existingVal.operator || "gte";
    }
    container.innerHTML = `
      <div class="form-group">
        <label>${isTarget ? "Target Debuff / DoT Name" : "Caster Buff Name"}</label>
        ${buildDatalistOrSelect("ruleStackBuffInput", items, curName, isTarget ? "Debuff" : "Buff")}
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Comparison Operator</label>
          <select id="ruleStackOpInput" style="width:100%;">
            <option value="gte" ${curOp === "gte" || curOp === ">=" ? "selected" : ""}>&ge; (At least)</option>
            <option value="eq" ${curOp === "eq" || curOp === "==" ? "selected" : ""}>== (Exactly)</option>
            <option value="lte" ${curOp === "lte" || curOp === "<=" ? "selected" : ""}>&le; (At most)</option>
            <option value="gt" ${curOp === "gt" || curOp === ">" ? "selected" : ""}>&gt; (Greater than)</option>
            <option value="lt" ${curOp === "lt" || curOp === "<" ? "selected" : ""}>&lt; (Less than)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Required Stacks</label>
          <input type="number" id="ruleStackCountInput" min="1" max="99" step="1" value="${curStacks}" style="width:100%;">
        </div>
      </div>
    `;
    return;
  }

  if (key === "target_hp_below_pct" || key === "target_hp_above_pct") {
    let curDec = 0.4;
    let curBypass = "";
    if (typeof existingVal === "number") {
      curDec = existingVal;
    } else if (existingVal && typeof existingVal === "object") {
      curDec = existingVal.pct ?? 0.4;
      curBypass = existingVal.bypass_if_buff_active || "";
    }
    container.innerHTML = `
      <div class="form-row">
        <div class="form-group">
          <label>Decimal Fraction (0.0 - 1.0)</label>
          <input type="number" id="ruleHpDecInput" min="0.01" max="1.0" step="0.05" value="${curDec}" style="width:100%;" oninput="document.getElementById('ruleHpPctPreview').textContent = Math.round(this.value * 100) + '%'">
        </div>
        <div class="form-group">
          <label>Target Health %</label>
          <div id="ruleHpPctPreview" style="padding:6px 10px;font-weight:700;color:var(--accent);font-size:14px;">${Math.round(curDec * 100)}%</div>
        </div>
      </div>
      ${key === "target_hp_below_pct" ? `
      <div class="form-group">
        <label>Optional: Bypass HP Check if Caster Buff Active</label>
        ${buildDatalistOrSelect("ruleHpBypassInput", buffItems, curBypass, "Bypass Buff")}
      </div>` : ""}
    `;
    return;
  }

  if (key === "caster_energy_below" || key === "caster_energy_above") {
    const cur = typeof existingVal === "number" ? existingVal : 35;
    container.innerHTML = `
      <div class="form-group">
        <label>Resource Threshold (Force / Energy / Heat)</label>
        <input type="number" id="ruleResourceInput" min="0" max="600" step="5" value="${cur}" style="width:100%;">
      </div>
    `;
    return;
  }

  if (key === "proc_cooldown_above") {
    const curName = (existingVal && existingVal.name) ? existingVal.name : (procItems[0]?.name || "Bloodletting");
    const curVal = (existingVal && existingVal.value !== undefined) ? existingVal.value : 1.5;
    container.innerHTML = `
      <div class="form-group">
        <label>Proc / Lockout Name</label>
        ${buildDatalistOrSelect("ruleProcNameInput", procItems, curName, "Proc")}
      </div>
      <div class="form-group">
        <label>Remaining Lockout / ICD Above (seconds)</label>
        <input type="number" id="ruleProcSecInput" min="0" max="120" step="0.1" value="${curVal}" style="width:100%;">
      </div>
    `;
    return;
  }

  if (key === "ability_cooldown_under" || key === "ability_cooldown_above") {
    const isAbove = key === "ability_cooldown_above";
    const curName = (existingVal && existingVal.name) ? existingVal.name : (abilityItems[0]?.name || "");
    const curVal = (existingVal && existingVal.value !== undefined) ? existingVal.value : 1.5;
    container.innerHTML = `
      <div class="form-group">
        <label>Ability Name</label>
        ${buildDatalistOrSelect("ruleAblCdNameInput", abilityItems, curName, "Ability")}
      </div>
      <div class="form-group">
        <label>Remaining Cooldown ${isAbove ? "Above" : "Under"} (seconds)</label>
        <input type="number" id="ruleAblCdSecInput" min="0" max="180" step="0.1" value="${curVal}" style="width:100%;">
      </div>
    `;
  }
}

function commitRuleFromModal() {
  if (!ruleModalContext) return;
  const { stepIndex, poolIndex, editKey } = ruleModalContext;
  const key = document.getElementById("ruleKeySelect").value;
  let value = null;

  if (key === "caster_has_buff" || key === "caster_does_not_have_buff") {
    value = document.getElementById("ruleBuffInput").value.trim();
    if (!value) return showToast("Please select or enter a buff name.", true);
  } else if (key === "target_has_debuff" || key === "target_doesnt_have_debuff") {
    value = document.getElementById("ruleDebuffInput").value.trim();
    if (!value) return showToast("Please select or enter a debuff name.", true);
  } else if (key === "caster_buff_stacks" || key === "target_debuff_stacks") {
    const name = document.getElementById("ruleStackBuffInput").value.trim();
    const op = document.getElementById("ruleStackOpInput").value;
    const count = parseInt(document.getElementById("ruleStackCountInput").value, 10) || 1;
    if (!name) return showToast("Please select or enter an effect name.", true);
    value = op === "gte" ? [name, count] : [name, count, op];
  } else if (key === "target_hp_below_pct" || key === "target_hp_above_pct") {
    let dec = parseFloat(document.getElementById("ruleHpDecInput").value);
    if (isNaN(dec) || dec <= 0) dec = 0.4;
    if (dec > 1.0) dec = Number((dec / 100.0).toFixed(4));
    const bypassEl = document.getElementById("ruleHpBypassInput");
    const bypass = bypassEl ? bypassEl.value.trim() : "";
    value = bypass ? { pct: dec, bypass_if_buff_active: bypass } : dec;
  } else if (key === "caster_energy_below" || key === "caster_energy_above") {
    value = parseFloat(document.getElementById("ruleResourceInput").value) || 0;
  } else if (key === "proc_cooldown_above") {
    const name = document.getElementById("ruleProcNameInput").value.trim();
    const sec = parseFloat(document.getElementById("ruleProcSecInput").value) || 0.5;
    if (!name) return showToast("Please select or enter a proc name.", true);
    value = { name, value: sec };
  } else if (key === "ability_cooldown_under" || key === "ability_cooldown_above") {
    const name = document.getElementById("ruleAblCdNameInput").value.trim();
    const sec = parseFloat(document.getElementById("ruleAblCdSecInput").value) || 1.5;
    if (!name) return showToast("Please select or enter an ability name.", true);
    value = { name, value: sec };
  }

  const targetObj = poolIndex === null
    ? rotationSteps[stepIndex]
    : rotationSteps[stepIndex].pool[poolIndex];

  if (!targetObj.rules) targetObj.rules = {};
  if (editKey && editKey !== key) {
    delete targetObj.rules[editKey];
  }
  targetObj.rules[key] = value;

  closeRuleModal();
  renderTimeline();
  renderRightPanel();
}

function switchRightTab(tab) {
  rightTab = tab;
  for (const [id, key] of [
    ["rTabLint", "lint"],
    ["rTabPreview", "preview"],
    ["rTabJson", "json"]
  ]) {
    document.getElementById(id).classList.toggle("active", key === tab);
  }
  renderRightPanel();
}

function runRotationLinter() {
  const issues = [...lastImportWarnings];

  rotationSteps.forEach((step, idx) => {
    if (step.type === "fixed" || step.type === "optional") {
      const m = resolveAbilityDisplay(step.ability_id);
      if (!m) {
        issues.push(`Step #${idx + 1} (${step.type}): ability '${step.ability_id}' is not in the active ${currentLoadout.spec_name} loadout.`);
      } else if (step.type === "fixed" && !m.triggers_gcd && m.cooldown > 0) {
        issues.push(`Step #${idx + 1}: Off-GCD ability '${m.name}' (${m.cooldown}s CD) will pre-cast early before the next GCD, but as a Fixed Step it will block if on cooldown. Consider 'Optional Cast' if you want it skipped when on cooldown.`);
      }
    } else if (step.type === "priority_block") {
      const pool = step.pool || [];
      if (!pool.length) {
        issues.push(`Block '${step.name}' (#${idx + 1}) has an empty ability pool.`);
        return;
      }
      const last = pool[pool.length - 1];
      const lastRules = Object.keys(last.rules || {});
      const lastAbl = resolveAbilityDisplay(last.ability_id);
      if (lastRules.length > 0 || (lastAbl && (lastAbl.cooldown > 0 || lastAbl.energy_cost > 0))) {
        issues.push(`Block '${step.name}' (#${idx + 1}): last fallback ability '${last.ability_id}' has conditions/cooldown/cost. Adding an unconditional basic attack (e.g. saber_strike) at the bottom prevents GCD stalls.`);
      }
      pool.forEach((row, rIdx) => {
        if (!resolveAbilityDisplay(row.ability_id)) {
          issues.push(`Block '${step.name}' row #${rIdx + 1}: ability '${row.ability_id}' is not in the active ${currentLoadout.spec_name} loadout.`);
        }
      });
    }
  });

  return issues;
}

    const issues = runRotationLinter();
    let html = `<div style="font-weight:700;margin-bottom:8px;">Rotation Health Check (${rotationSteps.length} steps)</div>`;

        <span style="font-weight:700;">Live Rotation JSON</span>
        <div style="display:flex;gap:6px;">
          <button class="btn-sm" onclick="copyJsonToClipboard()">Copy JSON</button>
          <button class="btn-sm btn-primary" onclick="applyEditedJson()">Apply Edited JSON</button>
        </div>
      </div>
      <textarea id="rawJsonEditor" class="json-textarea">${escapeHtml(jsonStr)}</textarea>
    `;
  }
}

function insertSavedStepTemplate(tIdx) {
  const tmpl = savedTemplates[tIdx];
  if (!tmpl || tmpl.kind !== "step") return;
  rotationSteps.push(JSON.parse(JSON.stringify(tmpl.data)));
  renderTimeline();
  renderRightPanel();
  showToast(`Inserted '${tmpl.name}' at end of timeline.`);
}

async function runDryRunSimulation() {
  if (!rotationSteps.length) {
    return showToast("Add at least one step before running preview.", true);
  }
  const res = await fetch("/api/preview", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      env: currentEnvironment,
      spec_path: currentLoadout.spec_path,
      choices: currentLoadout.choices,
      tactical_fqn: document.getElementById("tacticalSelect").value || "",
      legendary_fqns: getSelectedLegendaries(),
      relic_fqns: getSelectedRelics(),
      rotation: rotationSteps,
      duration: 30.0
    })
  });
  const data = await res.json();
  if (data.error) {
    showToast(`Preview failed: ${data.error}`, true);
    return;
  }
  dryRunResult = data;
  renderRightPanel();
  showToast(`Simulated 30s: ${data.casts.length} casts (${data.dps.toLocaleString()} DPS)`);
}

function copyJsonToClipboard() {
  const str = JSON.stringify(rotationSteps, null, 4);
  navigator.clipboard.writeText(str);
  showToast("Copied rotation JSON to clipboard.");
}

function applyEditedJson() {
  const el = document.getElementById("rawJsonEditor");
  if (!el) return;
  try {
    const parsed = JSON.parse(el.value);
    if (!Array.isArray(parsed)) throw new Error("Root JSON must be an array.");
    rotationSteps = parsed;
    renderTimeline();
    renderRightPanel();
    showToast("Applied JSON changes to timeline.");
  } catch (err) {
    showToast(`JSON Error: ${err.message}`, true);
  }
}

async function saveRotationToDisk() {
  if (!currentLoadout || !currentLoadout.class_name || !currentLoadout.spec_name) {
    showToast("Please select a Class and Discipline before saving.", true);
    return;
  }
  let filename = (document.getElementById("saveFilename")?.value || "CustomRotation.json").trim();
  if (!filename) filename = "CustomRotation.json";
  if (!filename.endsWith(".json")) filename += ".json";
  filename = filename.replace(/^.*[\\/]/, "");

  const classFolder = (currentLoadout && currentLoadout.default_class_folder) || "assassin";
  const specFolder = (currentLoadout && currentLoadout.default_spec_folder) || "hatred";

  const res = await fetch("/api/rotation/save", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      class_folder: classFolder,
      spec_folder: specFolder,
      filename: filename,
      steps: rotationSteps
    })
  });
  const data = await res.json();
  if (data.error) {
    showToast(`Save failed: ${data.error}`, true);
    return;
  }
  await loadWorkspaceCatalog(false, data.path);

  const isWebMode = window.PYODIDE_BRIDGE || window.location.port === "8080" || !window.location.port;
  if (isWebMode) {
    showToast(`[OK] Saved ${filename} to My Custom Files`);
  } else {
    showToast(`[OK] Saved to workspace disk: ${data.path}`);
  }
}

function downloadRotationJson() {
  let filename = (document.getElementById("saveFilename")?.value || "CustomRotation.json").trim();
  if (!filename) filename = "CustomRotation.json";
  if (!filename.endsWith(".json")) filename += ".json";
  filename = filename.replace(/^.*[\\/]/, "");

  const blob = new Blob([JSON.stringify(rotationSteps, null, 4)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
  showToast(`[OK] Downloaded ${filename}`);
}

function escapeHtml(str) {
  return String(str ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function escapeAttr(str) {
  return escapeHtml(str).replace(/'/g, "&#39;");
}
</script>
