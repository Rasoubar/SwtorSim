        </div>
        <div style="max-height:460px;overflow-y:auto;border:1px solid var(--border);border-radius:6px;">
          <table class="cast-table">
            <thead>
              <tr>
                <th>Time</th>
                <th>Ability</th>
                <th>Step</th>
                <th>Res</th>
              </tr>
            </thead>
            <tbody>
              ${dryRunResult.casts.map(c => `
                <tr>
                  <td style="font-family:monospace;color:var(--text-muted);">${c.time.toFixed(2)}s</td>
                  <td>
                    <strong>${escapeHtml(c.ability)}</strong>
                    ${c.triggers_gcd ? "" : '<span class="badge badge-offgcd">Off-GCD</span>'}
                  </td>
                  <td style="color:var(--text-muted);">#${c.step_index} (${escapeHtml(c.step_label)})</td>
                  <td>${c.resource}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      `;
    } else {
      html += `<div style="color:var(--text-muted);text-align:center;padding:30px 10px;">Click <strong>Run 30s Preview</strong> to test this rotation against the Training Dummy.</div>`;
    }
    container.innerHTML = html;
    return;
  }

  if (rightTab === "json") {
    const jsonStr = JSON.stringify(rotationSteps, null, 4);
    container.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <span style="font-weight:700;">Live Rotation JSON</span>
        <div style="display:flex;gap:6px;">
          <button class="btn-sm" onclick="copyJsonToClipboard()">Copy JSON</button>
          <button class="btn-sm btn-primary" onclick="applyEditedJson()">Apply Edited JSON</button>
        </div>
      </div>
      <textarea id="rawJsonEditor" class="json-textarea">${escapeHtml(jsonStr)}</textarea>
    `;
  }
}

function insertSavedStepTemplate(tIdx) {
  const tmpl = savedTemplates[tIdx];
  if (!tmpl || tmpl.kind !== "step") return;
  rotationSteps.push(JSON.parse(JSON.stringify(tmpl.data)));
  renderTimeline();
  renderRightPanel();
  showToast(`Inserted '${tmpl.name}' at end of timeline.`);
}

async function runDryRunSimulation() {
  if (!rotationSteps.length) {
    return showToast("Add at least one step before running preview.", true);
  }
  const res = await fetch("/api/preview", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      spec_path: currentLoadout.spec_path,
      choices: currentLoadout.choices,
      tactical_fqn: document.getElementById("tacticalSelect").value || "",
      legendary_fqns: getSelectedLegendaries(),
      relic_fqns: getSelectedRelics(),
      rotation: rotationSteps,
      duration: 30.0
    })
  });
  const data = await res.json();
  if (data.error) {
    showToast(`Preview failed: ${data.error}`, true);
    return;
  }
  dryRunResult = data;
  renderRightPanel();
  showToast(`Simulated 30s: ${data.casts.length} casts (${data.dps.toLocaleString()} DPS)`);
}

function copyJsonToClipboard() {
  const str = JSON.stringify(rotationSteps, null, 4);
  navigator.clipboard.writeText(str);
  showToast("Copied rotation JSON to clipboard.");
}

function applyEditedJson() {
  const el = document.getElementById("rawJsonEditor");
  if (!el) return;
  try {
    const parsed = JSON.parse(el.value);
    if (!Array.isArray(parsed)) throw new Error("Root JSON must be an array.");
    rotationSteps = parsed;
    renderTimeline();
    renderRightPanel();
    showToast("Applied JSON changes to timeline.");
  } catch (err) {
    showToast(`JSON Error: ${err.message}`, true);
  }
}

async function saveRotationToDisk() {
  const classFolder = document.getElementById("saveClassFolder").value.trim() || "assassin";
  const specFolder = document.getElementById("saveSpecFolder").value.trim() || "hatred";
  const filename = document.getElementById("saveFilename").value.trim() || "CustomRotation.json";

  const res = await fetch("/api/rotation/save", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      class_folder: classFolder,
      spec_folder: specFolder,
      filename: filename,
      steps: rotationSteps
    })
  });
  const data = await res.json();
  if (data.error) {
    showToast(`Save failed: ${data.error}`, true);
    return;
  }
  await loadWorkspaceCatalog();
  document.getElementById("existingRotationSelect").value = data.path;
  showToast(`[OK] Saved to ${data.path}`);
}

function downloadRotationJson() {
  const filename = (document.getElementById("saveFilename").value.trim() || "CustomRotation.json").replace(/(\.json)?$/, ".json");
  const blob = new Blob([JSON.stringify(rotationSteps, null, 4)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

function escapeHtml(str) {
  return String(str ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function escapeAttr(str) {
  return escapeHtml(str).replace(/'/g, "&#39;");
}
